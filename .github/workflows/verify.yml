name: Verify Release

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version
      - run: npm ci
      - run: npm run verify
      - name: Validate Store metadata
        run: npm run lint:store
      - name: Verify universal native binary
        run: |
          lipo assets/compiled_raycast_swift/swift -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures assets/compiled_raycast_swift/swift
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acal-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 14
